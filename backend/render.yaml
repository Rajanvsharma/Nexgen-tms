services:
  - type: web
    name: nexgen-tms-backend
    runtime: node
    buildCommand: npm install --workspace=backend && backend/node_modules/.bin/prisma generate --schema=backend/prisma/schema.prisma
    startCommand: backend/node_modules/.bin/prisma migrate deploy --schema=backend/prisma/schema.prisma && node backend/src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
