<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B2560;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Speed lines (left side) -->
  <g opacity="0.9">
    <rect x="30" y="62" width="90" height="7" rx="3.5" fill="url(#speedGrad)" opacity="1"/>
    <rect x="48" y="75" width="72" height="6" rx="3" fill="url(#speedGrad)" opacity="0.85"/>
    <rect x="56" y="88" width="60" height="5" rx="2.5" fill="url(#speedGrad)" opacity="0.7"/>
    <rect x="64" y="99" width="50" height="4" rx="2" fill="url(#speedGrad)" opacity="0.55"/>
    <rect x="70" y="109" width="42" height="3.5" rx="1.75" fill="url(#speedGrad)" opacity="0.4"/>
    <rect x="76" y="118" width="34" height="3" rx="1.5" fill="url(#speedGrad)" opacity="0.25"/>
  </g>

  <!-- T letter body -->
  <!-- Horizontal bar of T -->
  <polygon points="100,40 340,40 320,90 220,90 220,195 175,220 160,90 118,90" fill="url(#tGrad)"/>

  <!-- Vertical stem of T (right portion going down) -->
  <polygon points="220,90 320,90 295,210 245,230 220,90" fill="#0B2560" opacity="0.4"/>

  <!-- Inner highlight/facet on T -->
  <polygon points="175,90 210,90 210,185 185,200" fill="#1976D2" opacity="0.3"/>

  <!-- Sharp bottom tip of T -->
  <polygon points="175,195 220,90 245,230 200,240" fill="url(#tGrad)"/>

  <!-- TRANSA text -->
  <text x="200" y="265" font-family="'Arial Black', 'Arial Bold', sans-serif" font-size="52" font-weight="900" fill="#0B2560" text-anchor="middle" letter-spacing="10">TRANSA</text>
</svg>
