<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="500" height="420">
  <defs>
    <linearGradient id="tGradMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1E5C;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#1A4FBE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#38B6FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tGradShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A8A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0B1E5C;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tGradShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Speed lines (left of T) -->
  <rect x="60" y="108" width="62" height="10" rx="5" fill="#1A6FD4" opacity="0.9"/>
  <rect x="74" y="126" width="44" height="8"  rx="4" fill="#1A6FD4" opacity="0.65"/>

  <!-- T horizontal bar -->
  <path d="M118,72 L390,72 Q420,72 418,92 Q410,130 380,148 L240,148 L222,148 L136,148 Z"
        fill="url(#tGradMain)"/>

  <!-- T vertical stem -->
  <path d="M222,148 L240,148 L240,295 Q240,310 232,318 Q224,326 215,320 L195,295 L195,148 Z"
        fill="url(#tGradMain)"/>

  <!-- 3D shadow facet on stem -->
  <path d="M240,148 L258,155 L258,300 L240,295 Z"
        fill="url(#tGradShadow)" opacity="0.55"/>

  <!-- 3D shadow facet on horizontal bar -->
  <path d="M118,148 L136,148 L136,162 L118,155 Z"
        fill="url(#tGradShadow)" opacity="0.4"/>

  <!-- Wing tip curve highlight -->
  <path d="M370,72 Q420,72 418,92 Q410,130 380,148 L360,148 Q390,128 395,105 Q398,82 370,82 Z"
        fill="url(#tGradShine)" opacity="0.6"/>

  <!-- Shine on horizontal bar -->
  <path d="M118,72 L390,72 Q405,72 410,82 L118,82 Z"
        fill="url(#tGradShine)"/>

  <!-- TRANSA text -->
  <text x="250" y="355"
        font-family="'Arial Black','Impact','Franklin Gothic Heavy',sans-serif"
        font-size="72" font-weight="900"
        fill="#0B1E5C"
        text-anchor="middle"
        letter-spacing="8">TRANSA</text>

  <!-- Triangle accent in A of TRANSA -->
  <polygon points="412,340 424,355 400,355" fill="#2B8FE8"/>

  <!-- Tagline -->
  <line x1="52"  y1="382" x2="90"  y2="382" stroke="#2B8FE8" stroke-width="2"/>
  <text x="250" y="387"
        font-family="'Arial','Helvetica',sans-serif"
        font-size="15" font-weight="600"
        fill="#0B1E5C"
        text-anchor="middle"
        letter-spacing="3">MOVE SMARTER. DELIVER BETTER.</text>
  <line x1="410" y1="382" x2="448" y2="382" stroke="#2B8FE8" stroke-width="2"/>
</svg>
